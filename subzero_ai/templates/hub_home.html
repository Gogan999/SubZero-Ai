{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Home · {{ settings.app_name }}{% endblock %}
{% block main %}
<section class="page">
  <h1>Hi, {{ viewer.name.split(' ')[0] }}</h1>
  <p class="lede">The team's tools.</p>
  <ul class="tool-tiles">
    {% for t in tools %}
    <li><a class="tool-tile" href="{{ t.href }}">{{ icon(t.icon) }}<span>{{ t.label }}</span></a></li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
